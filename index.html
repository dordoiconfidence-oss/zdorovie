<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Здоровье">
<meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Здоровье семьи</title>
<style>
:root{--bg:#f7f2ea;--card:#fffdf9;--text:#2d2620;--muted:#8a7f74;--line:#ebe2d6;--accent:#cf6646;--accentbg:#f8e3d9;--green:#3a9460;--greenbg:#e2f2e7;--orange:#d27a14;--orangebg:#fcefd9;--red:#cf453d;--redbg:#fbe3e1;--chip:#efe6da;--shadow:0 1px 3px rgba(90,60,30,.09);--bar:rgba(255,253,249,.92)}
@media (prefers-color-scheme:dark){:root{--bg:#171412;--card:#25201c;--text:#f3ece4;--muted:#a69a8d;--line:#352e28;--accent:#ee8a68;--accentbg:#3b2a22;--green:#5cc285;--greenbg:#1d3126;--orange:#f2a548;--orangebg:#3a2c18;--red:#f06a60;--redbg:#3e2120;--chip:#342d27;--shadow:none;--bar:rgba(37,32,28,.92)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;font-size:17px;-webkit-text-size-adjust:100%;line-height:1.3}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;text-align:inherit}
input,select,textarea{font:inherit}
main{max-width:600px;margin:0 auto;padding:4px 16px 28px}
h1{font-size:32px;margin:2px 2px 12px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin:10px 2px 0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:24px 4px 8px}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);min-height:60px;width:100%;text-align:left}
.row:last-child{border-bottom:none}
button.row:active{background:var(--chip)}
.grow{flex:1;min-width:0}
.row .t{font-weight:650}
.row .s{font-size:14px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted);font-size:26px;line-height:1;flex:none}
.av{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none;background:var(--chip);background:color-mix(in srgb,var(--pc,#999) 20%,transparent)}
.av.big{width:76px;height:76px;border-radius:38px;font-size:42px}
.pchips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 8px;padding:2px 16px 6px;scrollbar-width:none}
.pchips::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:6px;padding:0 15px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);font-size:16px;font-weight:600;min-height:44px}
.pchip.on{background:var(--pc,var(--text));color:#fff}
.pchip[data-id=all].on{background:var(--text);color:var(--bg)}
.seg{display:flex;background:var(--chip);border-radius:13px;padding:3px;margin:4px 0 6px}
.seg button{flex:1;padding:11px 4px;border-radius:10px;font-size:15px;font-weight:600;text-align:center;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-weight:650;color:var(--accent);font-size:17px;text-align:center;padding:0 14px}
.btn:active{opacity:.75}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.btn.green{background:var(--green);color:#fff;box-shadow:none}
.btn.danger{color:var(--red)}
.btn.small{min-height:44px;font-size:15px;width:auto}
.btns{display:grid;gap:8px;margin-top:12px}
.btns.two{grid-template-columns:1fr 1fr}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:10px;white-space:nowrap;display:inline-block}
.badge.g{background:var(--greenbg);color:var(--green)}.badge.o{background:var(--orangebg);color:var(--orange)}.badge.r{background:var(--redbg);color:var(--red)}.badge.m{background:var(--chip);color:var(--muted)}.badge.a{background:var(--accentbg);color:var(--accent)}
/* today */
.prog{display:flex;align-items:center;gap:14px}
.prog .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:5px;transition:width .3s}
.alert{display:flex;gap:12px;align-items:center;padding:13px 16px;border-radius:16px;margin-top:8px;width:100%;text-align:left}
.alert .ic{font-size:24px;flex:none}
.alert .t{font-weight:650}.alert .s{font-size:14px;margin-top:2px;opacity:.85}
.alert.o{background:var(--orangebg)}.alert.r{background:var(--redbg)}.alert.b{background:var(--accentbg)}.alert.g{background:var(--greenbg)}
.alert .act{flex:none;font-weight:700;color:var(--accent);background:var(--card);padding:9px 12px;border-radius:12px;font-size:15px}
.gh{display:flex;align-items:center;gap:10px;margin:24px 4px 8px;flex-wrap:wrap}
.gh .nm{font-weight:750;font-size:20px}
.gh .av{width:34px;height:34px;font-size:19px}
.apill{background:var(--redbg);color:var(--red);font-size:13px;font-weight:700;padding:4px 10px;border-radius:12px}
.dose{display:flex;gap:12px;padding:14px 16px 14px 12px;border-bottom:1px solid var(--line);align-items:flex-start;border-left:5px solid transparent}
.dose:last-child{border-bottom:none}
.dose.ok{border-left-color:var(--green)}
.dose.now{border-left-color:var(--orange);background:var(--orangebg)}
.dose.bad{border-left-color:var(--red);background:var(--redbg)}
.dose.skip{border-left-color:var(--muted);opacity:.8}
.dose .tm{font-size:19px;font-weight:800;width:56px;flex:none;font-variant-numeric:tabular-nums;padding-top:1px}
.dose .info{flex:1;min-width:0}
.dose .nm{font-weight:700;font-size:17px;word-break:break-word}
.dose .ds{font-size:15px;color:var(--muted);margin-top:2px}
.dose .stt{font-size:13px;font-weight:700;margin-top:5px}
.dose.now .stt{color:var(--orange)}.dose.bad .stt{color:var(--red)}
.dose .mini{display:flex;gap:0 18px;margin-top:4px;flex-wrap:wrap}
.dose .mini button{color:var(--muted);font-size:15px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.take{background:var(--green);color:#fff;font-weight:750;border-radius:14px;padding:0 14px;min-height:50px;font-size:16px;flex:none;align-self:center;white-space:nowrap}
.take:active{transform:scale(.96)}
.tag{font-weight:750;border-radius:12px;padding:10px 12px;flex:none;align-self:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.tag.ok{color:var(--green);background:var(--greenbg)}
.tag.sk{color:var(--muted);background:var(--chip)}
.give{background:var(--accent);color:#fff;font-weight:750;border-radius:14px;padding:0 14px;min-height:50px;font-size:16px;flex:none;align-self:center;white-space:nowrap}
.warn-t{color:var(--orange);font-weight:650;font-size:14px;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:26px 18px;line-height:1.45}
.empty .e{font-size:42px;margin-bottom:6px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
/* meds list */
.mc .pbar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:7px}
.mc .pbar i{display:block;height:100%;background:var(--accent)}
.dot{width:12px;height:12px;border-radius:6px;flex:none;background:var(--pc,#999)}
/* detail */
.hero{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.hero .nm{font-size:24px;font-weight:800;line-height:1.15;word-break:break-word}
.hero .s{color:var(--muted);margin-top:3px;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv>span:first-child{color:var(--muted);flex:none}
.kv>span:last-child{text-align:right;font-weight:550;word-break:break-word}
.allergy{background:var(--red);color:#fff;border-radius:16px;padding:13px 16px;font-weight:700;margin:10px 0}
.tl{position:relative}
.tli{display:flex;gap:12px;padding:10px 0;width:100%;text-align:left}
.tli .ic{width:38px;height:38px;border-radius:19px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none;font-size:19px}
.tli .t{font-weight:650}.tli .s{font-size:14px;color:var(--muted);margin-top:2px;word-break:break-word}
.tld{font-size:14px;font-weight:700;color:var(--muted);margin:18px 4px 2px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.photos img,.photos .add{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--chip);display:block}
.photos .add{display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted)}
.entry{padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;display:block}
.entry:last-child{border-bottom:none}
.entry .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.temp{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.temp.hi{color:var(--red)}.temp.mid{color:var(--orange)}.temp.ok{color:var(--green)}
/* calendar */
.calnav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.calnav b{font-size:19px}
.rbtn{width:46px;height:46px;border-radius:23px;background:var(--card);box-shadow:var(--shadow);color:var(--accent);font-size:26px;display:flex;align-items:center;justify-content:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:12px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--card);font-size:16px;position:relative;color:var(--muted)}
.cal .d.has{color:var(--text)}
.cal .d.g{background:var(--green);color:#fff}.cal .d.r{background:var(--red);color:#fff}.cal .d.o{background:var(--orange);color:#fff}
.cal .d.f{box-shadow:inset 0 0 0 2px var(--line);color:var(--text)}
.cal .d.sel{outline:3px solid var(--text);outline-offset:1px}
.cal .d .pd{position:absolute;bottom:4px;width:6px;height:6px;border-radius:3px;background:var(--accent)}
.cal .d.g .pd,.cal .d.r .pd,.cal .d.o .pd{background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* forms */
.fl{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:18px 4px 7px}
.field{display:block;width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:0 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
textarea.field{padding:12px 14px;min-height:88px;resize:vertical;line-height:1.35}
.field:focus{border-color:var(--accent)}
input[type=date].field,input[type=time].field{line-height:47px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:0 14px;font-size:16px;min-height:44px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trow{display:flex;gap:8px;margin-bottom:8px}
.trow .field{flex:1}
.xbtn{width:50px;height:50px;border-radius:14px;background:var(--chip);color:var(--red);font-size:24px;flex:none}
.tpre{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tpre button{background:var(--chip);border-radius:12px;padding:0 12px;min-height:40px;font-size:15px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 0;line-height:1.45}
.warnbox{background:var(--redbg);color:var(--red);border-radius:14px;padding:12px 14px;font-weight:650;margin-top:10px;font-size:15px}
.emo{font-size:26px;padding:0 10px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:44px;height:44px;border-radius:22px;border:3px solid transparent}
.colors button.on{border-color:var(--text)}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;color:var(--muted);font-size:11px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;text-align:center;position:relative}
.tab svg{width:27px;height:27px}
.tab.active{color:var(--accent)}
.tab .cnt{position:absolute;top:4px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;padding:0 5px;line-height:18px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(20,10,0,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;max-height:93vh;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:600px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.panel.anim{animation:up .24s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.shh{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.shh::before{content:'';position:absolute;top:6px;left:50%;width:40px;height:5px;border-radius:3px;background:var(--muted);opacity:.35;transform:translateX(-50%)}
.shh b{font-size:17px;text-align:center;flex:1;padding-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{color:var(--accent);font-size:17px;padding:16px 4px 6px;min-width:72px}
.lb.r{text-align:right;font-weight:750}
.shb{padding-top:6px}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(40,34,30,.96);color:#fff;padding:10px 12px 10px 18px;border-radius:24px;font-size:15px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);min-height:44px}
.toast.show{opacity:1;pointer-events:auto}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast button{color:#ffb79c;font-weight:800;padding:6px 8px;flex:none}
.viewer{position:fixed;inset:0;z-index:80;background:#000;display:none;flex-direction:column}
.viewer.show{display:flex}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vb{display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.viewer .vb button{color:#fff;font-size:17px;padding:10px;font-weight:600}
/* lock */
.lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;align-items:center;justify-content:center}
.lock.show{display:flex}
.lki{text-align:center;width:300px}
.lki .ic{font-size:46px}
.lki .t{font-size:20px;font-weight:700;margin:10px 0 18px}
.dots{display:flex;gap:18px;justify-content:center;margin-bottom:8px}
.dots i{width:16px;height:16px;border-radius:8px;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.lkerr{color:var(--red);height:22px;font-size:15px;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0 14px}
.pad button{height:72px;border-radius:36px;background:var(--card);box-shadow:var(--shadow);font-size:28px;font-weight:600}
.pad button:active{background:var(--chip)}
.pad button.nb{background:none;box-shadow:none;font-size:22px}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .22s 2}
/* report */
.report{position:fixed;inset:0;z-index:90;background:#e9e4dc;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.report.show{display:block}
.rpbar{position:sticky;top:0;display:flex;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#e9e4dc;z-index:2}
.rpbar button{background:#fff;color:#cf6646;font-weight:700;border-radius:14px;padding:0 16px;min-height:46px;font-size:16px}
.rpbar button.pr{background:#cf6646;color:#fff}
.rp{background:#fff;color:#222;max-width:800px;margin:0 auto 40px;padding:28px 22px;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.4}
.rp h1{font-size:22px;margin:0 0 4px}
.rp h3{font-size:15px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid #cf6646;color:#cf6646;text-transform:uppercase;letter-spacing:.04em}
.rp .rs{color:#555;margin:2px 0}
.rp .ra{background:#fde8e6;color:#b3261e;border:1.5px solid #b3261e;border-radius:8px;padding:8px 12px;font-weight:700;margin:12px 0}
.rp table{width:100%;border-collapse:collapse;margin:4px 0}
.rp td,.rp th{border-bottom:1px solid #ddd;padding:6px 6px;text-align:left;vertical-align:top}
.rp th{font-size:12px;color:#666;font-weight:600}
.rp .ri{margin:10px 0 14px;padding:10px 12px;border:1px solid #e3ddd4;border-radius:8px;page-break-inside:avoid}
.rp .rf{color:#888;font-size:12px;margin-top:24px}
@media print{
  body{background:#fff;padding:0}
  main,.tabbar,.sheet,.toast,.lock,.viewer,.noprint{display:none!important}
  .report{position:static;display:block!important;overflow:visible;background:#fff}
  .rp{margin:0;padding:0;max-width:none}
}
</style>
</head>
<body>
<main id="main"></main>

<nav class="tabbar">
  <button class="tab active" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M8 2.8v3.4M16 2.8v3.4M3.5 9.5h17"/><path d="m8.8 14.6 2.2 2.2 4.4-4.4"/></svg>Сегодня</button>
  <button class="tab" data-tab="meds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="8.2" width="18.4" height="7.6" rx="3.8" transform="rotate(-45 12 12)"/><path d="m8.6 8.6 6.8 6.8"/></svg>Лекарства</button>
  <button class="tab" data-tab="ill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V5a2.5 2.5 0 0 0-5 0v9.8a4.2 4.2 0 1 0 5 0z"/><path d="M11.5 9v7.5"/><circle cx="11.5" cy="18" r="1.3" fill="currentColor"/></svg>Болезни</button>
  <button class="tab" data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>История</button>

<script>
(function(){
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoDate(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const parseD=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoDate(d);};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const toMin=s=>{const a=s.split(':').map(Number);return a[0]*60+a[1];};
const fmtD=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'';
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const tsDate=ts=>isoDate(new Date(ts));
const fmtTs=ts=>fmtD(tsDate(ts))+' '+hm(ts);
const num=s=>{if(s==null)return null;s=String(s).replace(',','.').replace(/\s/g,'');if(s==='')return null;const n=parseFloat(s);return isFinite(n)?n:null;};
const nf=n=>String(Math.round(n*100)/100).replace('.',',');
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;};
const daysW=n=>n+' '+plural(n,'день','дня','дней');
function ageStr(b){if(!b)return '';const d=parseD(b),t=new Date();let m=(t.getFullYear()-d.getFullYear())*12+t.getMonth()-d.getMonth();if(t.getDate()<d.getDate())m--;if(m<0)return '';if(m<24)return m+' '+plural(m,'месяц','месяца','месяцев');const y=Math.floor(m/12);return y+' '+plural(y,'год','года','лет');}
function relDay(s){const t=today();if(s===t)return 'Сегодня';if(s===addDays(t,-1))return 'Вчера';if(s===addDays(t,1))return 'Завтра';const d=parseD(s);return d.getDate()+' '+MONTHS_GEN[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');}
function ago(ts){const m=Math.round((Date.now()-ts)/60000);if(m<1)return 'только что';if(m<60)return m+' мин назад';const h=Math.floor(m/60);if(h<24)return h+' ч'+(m%60?' '+(m%60)+' мин':'')+' назад';const d=Math.floor(h/24);return daysW(d)+' назад';}
function tempCls(t){return t>=38?'hi':t>=37.1?'mid':'ok';}

const SYMPTOMS=['Температура','Кашель','Насморк','Заложен нос','Боль в горле','Головная боль','Слабость','Озноб','Рвота','Понос','Боль в животе','Сыпь','Боль в ухе','Нет аппетита','Плохой сон'];
const FORMS=['Таблетка','Капсула','Сироп','Суспензия','Капли','Спрей','Мазь','Укол','Свечи','Порошок','Ингаляция','Другое'];
const FOOD=['Неважно','До еды','Во время еды','После еды','Натощак','Перед сном'];
const UNITS=['шт','мл','доз','кап','г'];
const MOODS=['😣','😟','😐','🙂','😄'];
const MOOD_T=['Очень плохо','Плохо','Так себе','Хорошо','Отлично'];
const SKIP_REASONS=['Забыли','Спал(а)','Отказался','Рвота','Нет лекарства','Врач отменил','Другое'];
const EMOJIS=['👦','👧','🧒','👶','👩','👨','👵','👴','🧑','👱‍♀️','🧔','🐣','🦁','🌸'];
const COLORS=['#4f8fd6','#d9668a','#3a9460','#d27a14','#8a63d2','#22a3a0','#c0563b','#7a8a99'];
const BLOOD=['I (0) Rh+','I (0) Rh−','II (A) Rh+','II (A) Rh−','III (B) Rh+','III (B) Rh−','IV (AB) Rh+','IV (AB) Rh−','Не знаю'];

/* ================= storage ================= */
let db=null,state=null,photoCache={},_idx=null;
const LS_KEY='familyHealth_state';
function idbOpen(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('familyHealth',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbReq(store,mode,fn){return new Promise((res,rej)=>{const tx=db.transaction(store,mode);const r=fn(tx.objectStore(store));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
const idbGet=(s,k)=>idbReq(s,'readonly',o=>o.get(k));
const idbPut=(s,k,v)=>idbReq(s,'readwrite',o=>o.put(v,k));
const idbDel=(s,k)=>idbReq(s,'readwrite',o=>o.delete(k));
const idbKeys=s=>idbReq(s,'readonly',o=>o.getAllKeys());
const idbClear=s=>idbReq(s,'readwrite',o=>o.clear());

function blank(){return {v:1,people:[
  {id:uid(),name:'Сын',emoji:'👦',color:'#4f8fd6',birth:'',blood:'',allergies:[],chronic:'',vaccines:[],measures:[],note:''},
  {id:uid(),name:'Жена',emoji:'👩',color:'#d9668a',birth:'',blood:'',allergies:[],chronic:'',vaccines:[],measures:[],note:''}],
  meds:[],intakes:[],illnesses:[],visits:[],tests:[],snooze:{},settings:{pin:null,lastBackup:null,backupNag:0,welcomed:false,medNames:[]}};}
function normalize(s){
  if(!s||!Array.isArray(s.people))return null;
  ['meds','intakes','illnesses','visits','tests'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  s.snooze=s.snooze||{};s.settings=Object.assign({pin:null,lastBackup:null,backupNag:0,welcomed:true,medNames:[]},s.settings||{});
  s.people.forEach(p=>{p.allergies=p.allergies||[];p.vaccines=p.vaccines||[];p.measures=p.measures||[];});
  s.meds.forEach(m=>{m.times=m.times||[];m.pauses=m.pauses||[];m.history=m.history||[];});
  s.illnesses.forEach(i=>{i.entries=i.entries||[];i.photos=i.photos||[];i.symptoms=i.symptoms||[];});
  s.visits.forEach(v=>{v.photos=v.photos||[];});s.tests.forEach(v=>{v.photos=v.photos||[];});
  return s;
}
async function initStorage(){
  try{db=await idbOpen();}catch(e){db=null;}
  let s=null;
  try{s=db?await idbGet('kv','state'):JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){s=null;}
  if(!s&&db){try{s=JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){}}
  state=normalize(s)||blank();
  if(!s)save();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
function save(){
  _idx=null;
  const fail=()=>alert('Не удалось сохранить данные. Проверьте свободное место на телефоне.');
  try{
    if(db)idbPut('kv','state',JSON.parse(JSON.stringify(state))).catch(fail);
    else localStorage.setItem(LS_KEY,JSON.stringify(state));
  }catch(e){fail();}
}
async function putPhoto(dataUrl){const id='p'+uid();photoCache[id]=dataUrl;if(db)await idbPut('photos',id,dataUrl);return id;}
async function getPhoto(id){if(photoCache[id])return photoCache[id];if(!db)return null;try{const v=await idbGet('photos',id);if(v)photoCache[id]=v;return v;}catch(e){return null;}}
async function delPhoto(id){delete photoCache[id];if(db){try{await idbDel('photos',id);}catch(e){}}}
function hydratePhotos(root){$$('img[data-photo]',root).forEach(async img=>{if(img.getAttribute('src'))return;const v=await getPhoto(img.dataset.photo);if(v)img.src=v;});}
function compressImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const max=1400;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72));};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};img.src=url;});}

/* ================= model helpers ================= */
const person=id=>state.people.find(p=>p.id===id);
const med=id=>state.meds.find(m=>m.id===id);
const ill=id=>state.illnesses.find(i=>i.id===id);
function idx(){if(!_idx){_idx=new Map();state.intakes.forEach(i=>{if(i.slot!=null)_idx.set(i.med+'|'+i.date+'|'+i.slot,i);});}return _idx;}
const intakeFor=(mid,d,s)=>idx().get(mid+'|'+d+'|'+s);
function medEnd(m){if(m.endType==='days'&&m.days)return addDays(m.start,m.days-1);if(m.endType==='date'&&m.endDate)return m.endDate;return null;}
function pausedOn(m,d){return (m.pauses||[]).some(p=>d>=p.from&&(!p.to||d<p.to));}
function activeOn(m,d){if(m.prn||d<m.start)return false;const e=medEnd(m);if(e&&d>e)return false;if(m.doneDate&&d>=m.doneDate)return false;return !pausedOn(m,d);}
function slotsOn(m,d){return activeOn(m,d)?(m.times||[]).slice().sort():[];}
function medState(m){if(m.status==='done')return 'done';if(m.status==='paused')return 'paused';const e=medEnd(m),t=today();if(e&&t>e)return 'done';if(m.start>t)return 'planned';return 'active';}
function perDay(m){return m.prn?0:(m.times||[]).length*(m.perDose||1);}
function stockInfo(m){if(m.stock==null||m.stock==='')return null;const s=+m.stock,pd=perDay(m);const days=pd?Math.floor(s/pd):null;return {s,days,low:pd?days<=3:s<=(m.perDose||1)*2};}
function courseInfo(m){
  if(m.prn)return {text:'По необходимости'+(m.interval?' · не чаще раза в '+nf(m.interval)+' ч':''),frac:null};
  const e=medEnd(m),t=today();
  if(!e)return {text:'Постоянно, с '+fmtD(m.start),frac:null};
  const total=diffDays(m.start,e)+1;
  if(t<m.start)return {text:'Начнётся '+fmtD(m.start)+' · '+daysW(total),frac:0};
  if(m.doneDate||t>e)return {text:'Курс '+daysW(total)+' · до '+fmtD(m.doneDate?addDays(m.doneDate,-1):e),frac:1};
  const n=diffDays(m.start,t)+1;return {text:'День '+n+' из '+total,frac:n/total};
}
function adherence(m){
  if(m.prn)return null;let exp=0,taken=0;const t=today(),e=medEnd(m);let end=e&&e<t?e:t;
  if(m.doneDate&&addDays(m.doneDate,-1)<end)end=addDays(m.doneDate,-1);
  const now=nowHM();let guard=0;
  for(let d=m.start;d<=end&&guard<4000;d=addDays(d,1),guard++){slotsOn(m,d).forEach(s=>{if(d===t&&s>now)return;exp++;const it=intakeFor(m.id,d,s);if(it&&it.status==='taken')taken++;});}
  return exp?{pct:Math.round(taken/exp*100),taken,exp}:null;
}
function slotInfo(m,date,slot){
  const it=intakeFor(m.id,date,slot);if(it)return {st:it.status,it};
  const t=today();if(date<t)return {st:'missed'};if(date>t)return {st:'future'};
  const sn=state.snooze[m.id+'|'+date+'|'+slot],now=Date.now(),slotTs=parseD(date).getTime()+toMin(slot)*60000;
  if(sn&&sn>now)return {st:'snoozed',until:sn};
  const ref=sn||slotTs;
  if(now<slotTs-30*60000)return {st:'upcoming'};
  if(now<=ref+60*60000)return {st:'now'};
  return {st:'overdue'};
}
const lastPrn=m=>state.intakes.filter(i=>i.med===m.id&&i.status==='taken').sort((a,b)=>b.at-a.at)[0];
const prnCountDay=(m,d)=>state.intakes.filter(i=>i.med===m.id&&i.date===d&&i.status==='taken').length;
function medNames(){const s=new Set(state.settings.medNames||[]);state.meds.forEach(m=>s.add(m.name));return Array.from(s).sort((a,b)=>a.localeCompare(b,'ru'));}
function defaultPerson(){return ui.person!=='all'&&person(ui.person)?ui.person:(state.people[0]&&state.people[0].id);}
function doseLine(m){return [m.dose,m.food&&m.food!=='Неважно'?m.food.toLowerCase():''].filter(Boolean).join(' · ');}

/* ================= ui state ================= */
const ui={tab:'today',person:'all',medSeg:'active',illSeg:'ill',histSeg:'cal',calMonth:today().slice(0,7),calDay:today(),histMed:'all',search:''};
const visiblePeople=()=>ui.person==='all'?state.people:state.people.filter(p=>p.id===ui.person);
const vis=pid=>ui.person==='all'||ui.person===pid;
function personChips(withAll){
  if(ui.person!=='all'&&!person(ui.person))ui.person='all';
  if(state.people.length<2&&!withAll)return '';
  return '<div class="pchips">'+'<button class="pchip'+(ui.person==='all'?' on':'')+'" data-act="setPerson" data-id="all">Все</button>'+
    state.people.map(p=>'<button class="pchip'+(ui.person===p.id?' on':'')+'" data-act="setPerson" data-id="'+p.id+'" style="--pc:'+p.color+'"><span>'+esc(p.emoji)+'</span>'+esc(p.name)+'</button>').join('')+'</div>';
}
const seg=(act,cur,opts)=>'<div class="seg">'+opts.map(o=>'<button class="'+(cur===o[0]?'on':'')+'" data-act="'+act+'" data-v="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>';
const av=(p,cls)=>p?'<div class="av'+(cls?' '+cls:'')+'" style="--pc:'+p.color+'">'+esc(p.emoji)+'</div>':'<div class="av">?</div>';
const pname=id=>{const p=person(id);return p?p.name:'—';};

/* ================= rendering: TODAY ================= */
function doseRow(m,date,slot){
  const s=slotInfo(m,date,slot);
  const cls={taken:'ok',skipped:'skip',missed:'bad',overdue:'bad',now:'now',snoozed:'now'}[s.st]||'';
  const da='data-med="'+m.id+'" data-date="'+date+'" data-slot="'+slot+'"';
  let right='',stt='',mini='';
  if(s.st==='taken')right='<button class="tag ok" data-act="editIntake" data-id="'+s.it.id+'">✓ '+hm(s.it.at)+'</button>';
  else if(s.st==='skipped'){right='<button class="tag sk" data-act="editIntake" data-id="'+s.it.id+'">Пропуск</button>';if(s.it.reason)stt='<div class="ds">'+esc(s.it.reason)+'</div>';}
  else{
    right='<button class="take" data-act="take" '+da+'>✓ Принято</button>';
    stt={now:'Пора принять',overdue:'Просрочено',snoozed:'Отложено до '+(s.until?hm(s.until):''),missed:'Не отмечено'}[s.st]||'';
    stt=stt?'<div class="stt">'+stt+'</div>':'';
    mini='<div class="mini"><button data-act="skip" '+da+'>Пропустил</button>'+(date===today()&&s.st!=='upcoming'?'<button data-act="snooze" '+da+'>Отложить 30 мин</button>':'')+'</div>';
  }
  return '<div class="dose '+cls+'"><div class="tm">'+slot+'</div><div class="info"><button data-act="openMed" data-id="'+m.id+'" style="text-align:left"><div class="nm">'+esc(m.name)+'</div><div class="ds">'+esc(doseLine(m)||m.form||'')+'</div></button>'+stt+mini+'</div>'+right+'</div>';
}
function prnRow(m){
  const last=lastPrn(m),cnt=prnCountDay(m,today());
  let info=last?'Последний раз: '+relDay(tsDate(last.at)).toLowerCase()+' в '+hm(last.at)+' ('+ago(last.at)+')':'Ещё не давали';
  if(cnt)info+=' · сегодня '+cnt+' '+plural(cnt,'раз','раза','раз');
  let warn='';
  if(m.interval&&last){const next=last.at+m.interval*3600000;if(Date.now()<next)warn='<div class="warn-t">Следующий приём не раньше '+(tsDate(next)!==today()?relDay(tsDate(next)).toLowerCase()+' ':'')+hm(next)+'</div>';}
  if(m.maxPerDay&&cnt>=m.maxPerDay)warn+='<div class="warn-t">Сегодня уже максимум ('+m.maxPerDay+')</div>';
  return '<div class="dose"><div class="tm" style="font-size:22px">⏱</div><div class="info"><button data-act="openMed" data-id="'+m.id+'" style="text-align:left"><div class="nm">'+esc(m.name)+'</div><div class="ds">'+esc(doseLine(m)||m.form||'')+' · по необходимости</div></button><div class="ds" style="font-size:14px;margin-top:5px">'+esc(info)+'</div>'+warn+'</div><button class="give" data-act="give" data-id="'+m.id+'">Дать</button></div>';
}
function renderToday(){
  const t=today(),d=new Date(),hr=d.getHours();
  const greet=hr<5?'Доброй ночи':hr<12?'Доброе утро':hr<18?'Добрый день':'Добрый вечер';
  let h='<div class="sub">'+WD[d.getDay()]+', '+d.getDate()+' '+MONTHS_GEN[d.getMonth()]+'</div><h1>'+greet+'</h1>'+personChips(true);
  const people=visiblePeople();let total=0,done=0,skipped=0;
  const groups=people.map(p=>{
    const meds=state.meds.filter(m=>m.person===p.id),rows=[];
    meds.forEach(m=>slotsOn(m,t).forEach(sl=>rows.push({m,sl})));
    rows.sort((a,b)=>a.sl<b.sl?-1:a.sl>b.sl?1:a.m.name.localeCompare(b.m.name));
    rows.forEach(r=>{total++;const it=intakeFor(r.m.id,t,r.sl);if(it){if(it.status==='taken')done++;else skipped++;}});
    return {p,rows,prn:meds.filter(m=>m.prn&&medState(m)==='active')};
  });
  if(!state.settings.welcomed){
    h+='<div class="card" style="margin-top:6px"><div style="font-size:20px;font-weight:800;margin-bottom:8px">Добро пожаловать! ❤️</div><div style="line-height:1.5">1. Укажите имена и даты рождения членов семьи.<br>2. Добавьте лекарства, которые назначил врач.<br>3. Каждый день отмечайте приём одним нажатием <b style="color:var(--green)">✓ Принято</b>.</div><div class="btns two"><button class="btn primary" data-act="goFamily">Заполнить семью</button><button class="btn" data-act="welcomeOk">Понятно</button></div></div>';
  }
  if(total){
    const pct=Math.round(done/total*100);

/* ================= HISTORY screen ================= */
function dayStats(d,pids,mid){
  let exp=0,taken=0,skipped=0;
  state.meds.forEach(m=>{if(!pids.includes(m.person)||(mid!=='all'&&m.id!==mid))return;const sl=slotsOn(m,d);exp+=sl.length;sl.forEach(s=>{const it=intakeFor(m.id,d,s);if(it){if(it.status==='taken')taken++;else skipped++;}});});
  const prn=state.intakes.some(i=>i.date===d&&i.slot==null&&i.status==='taken'&&pids.includes(i.person)&&(mid==='all'||i.med===mid));
  return {exp,taken,skipped,prn};
}
function renderHist(){
  let h='<h1>История</h1>'+personChips(true)+seg('histSeg',ui.histSeg,[['cal','Приём лекарств'],['tl','Хронология']]);
  if(ui.histSeg==='cal')h+=renderCal();else h+='<input class="field" id="tlSearch" type="search" placeholder="🔍 Поиск: лекарство, болезнь, врач…" value="'+esc(ui.search)+'" style="margin-top:8px"><div id="tlList">'+timelineHTML()+'</div>';
  return h;
}
function renderCal(){
  const pids=visiblePeople().map(p=>p.id);
  const meds=state.meds.filter(m=>pids.includes(m.person));
  if(ui.histMed!=='all'&&!meds.some(m=>m.id===ui.histMed))ui.histMed='all';
  let h='<select class="field" id="histMed" style="margin-top:8px"><option value="all">Все лекарства</option>'+meds.map(m=>'<option value="'+m.id+'"'+(ui.histMed===m.id?' selected':'')+'>'+esc(m.name)+(ui.person==='all'&&state.people.length>1?' — '+esc(pname(m.person)):'')+'</option>').join('')+'</select>';
  const [Y,M]=ui.calMonth.split('-').map(Number);
  h+='<div class="calnav"><button class="rbtn" data-act="calShift" data-v="-1">‹</button><b>'+MONTHS[M-1]+' '+Y+'</b><button class="rbtn" data-act="calShift" data-v="1">›</button></div>';
  const first=new Date(Y,M-1,1),days=new Date(Y,M,0).getDate(),off=(first.getDay()+6)%7,t=today();
  let g='<div class="cal">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w=>'<div class="wd">'+w+'</div>').join('');
  for(let i=0;i<off;i++)g+='<div></div>';
  let mExp=0,mTaken=0;
  for(let dn=1;dn<=days;dn++){
    const d=Y+'-'+pad(M)+'-'+pad(dn),s=dayStats(d,pids,ui.histMed);let c='';
    if(s.exp){if(d>t)c='f';else{if(s.taken===s.exp)c='g';else if(d===t)c='o';else c='r';mExp+=s.exp;mTaken+=s.taken;}}
    g+='<button class="d '+c+(s.exp||s.prn?' has':'')+(d===ui.calDay?' sel':'')+'" data-act="calDay" data-v="'+d+'">'+dn+(s.prn?'<span class="pd"></span>':'')+'</button>';
  }
  g+='</div>';
  h+='<div class="card">'+g+'<div class="legend"><span><i style="background:var(--green)"></i>Всё принято</span><span><i style="background:var(--red)"></i>Есть пропуски</span><span><i style="background:var(--orange)"></i>Сегодня, не всё</span><span><i style="background:var(--accent);border-radius:6px"></i>По необходимости</span></div>'+
    (mExp?'<div style="margin-top:12px;font-weight:650">За месяц принято '+Math.round(mTaken/mExp*100)+'% <span class="muted" style="font-weight:500">('+mTaken+' из '+mExp+')</span></div>':'')+'</div>';

  let any=false;
  visiblePeople().forEach(p=>{
    const rows=[];state.meds.filter(m=>m.person===p.id&&(ui.histMed==='all'||m.id===ui.histMed)).forEach(m=>slotsOn(m,d).forEach(sl=>rows.push({m,sl})));
    rows.sort((a,b)=>a.sl<b.sl?-1:1);
    const prn=state.intakes.filter(i=>i.date===d&&i.slot==null&&i.person===p.id&&(ui.histMed==='all'||i.med===ui.histMed)).sort((a,b)=>a.at-b.at);
    if(!rows.length&&!prn.length)return;any=true;
    if(ui.person==='all'&&state.people.length>1)h+='<div class="gh">'+av(p)+'<span class="nm">'+esc(p.name)+'</span></div>';
    h+='<div class="list">'+rows.map(r=>doseRow(r.m,d,r.sl)).join('')+prn.map(i=>{const m=med(i.med);return '<div class="dose ok"><div class="tm">'+hm(i.at)+'</div><div class="info"><div class="nm">'+esc(m?m.name:'Удалённое лекарство')+'</div><div class="ds">'+esc(m?doseLine(m):'')+' · по необходимости</div></div><button class="tag ok" data-act="editIntake" data-id="'+i.id+'">✓ Дали</button></div>';}).join('')+'</div>';
  });
  if(!any)h+='<div class="card empty">В этот день лекарства не назначены.</div>';
  else if(d<t)h+='<div class="hint">Можно отметить приём задним числом — нажмите «✓ Принято». Время можно исправить, нажав на отметку.</div>';
  return h;
}
function timelineEvents(){
  const ev=[],pids=visiblePeople().map(p=>p.id),t=today();
  const push=(date,ts,icon,title,sub,pid,act,id)=>{if(pids.includes(pid))ev.push({date,ts:ts||0,icon,title,sub:sub||'',pid,act,id});};
  state.meds.forEach(m=>{
    push(m.start,m.created,'💊','Начат приём: '+m.name,[m.dose,m.prn?'по необходимости':(m.times||[]).join(', '),m.reason?'для: '+m.reason:'',m.doctor?'назначил: '+m.doctor:''].filter(Boolean).join(' · '),m.person,'openMed',m.id);
    m.history.forEach(hh=>{if(hh.type==='start')return;const ic={change:'✏️',pause:'⏸',resume:'▶️',done:'⏹',reopen:'▶️'}[hh.type]||'•';push(tsDate(hh.ts),hh.ts,ic,{change:'Изменение: ',pause:'Пауза: ',resume:'Возобновлён: ',done:'Курс завершён: ',reopen:'Курс возобновлён: '}[hh.type]+m.name,hh.text+(hh.reason?' · Причина: '+hh.reason:''),m.person,'openMed',m.id);});
    const e=medEnd(m);if(e&&e<t&&!m.doneDate&&m.status!=='done')push(e,0,'✅','Курс окончен: '+m.name,'',m.person,'openMed',m.id);
  });
  state.illnesses.forEach(i=>{
    push(i.start,i.created,'🤒','Заболел(а): '+i.title,[i.symptoms.join(', '),i.doctor?'врач: '+i.doctor:''].filter(Boolean).join(' · '),i.person,'openIll',i.id);
    if(i.end){const mx=Math.max(...i.entries.filter(e=>e.temp!=null).map(e=>e.temp),0);push(i.end,0,'💚','Выздоровление: '+i.title,daysW(diffDays(i.start,i.end)+1)+(mx?' · макс. t° '+nf(mx):''),i.person,'openIll',i.id);}
  });
  state.visits.forEach(v=>push(v.date,0,'🩺','Врач: '+(v.specialty||v.doctor||'визит'),[v.doctor&&v.specialty?v.doctor:'',v.said,v.prescriptions?'назначено: '+v.prescriptions:''].filter(Boolean).join(' · '),v.person,'openVisit',v.id));
  state.tests.forEach(x=>push(x.date,0,'🧪','Анализ: '+x.name,x.result||'',x.person,'openTest',x.id));
  state.people.forEach(p=>{
    p.vaccines.forEach(v=>push(v.date,0,'💉','Прививка: '+v.name,v.note||'',p.id,'openPerson',p.id));
    p.measures.forEach(ms=>push(ms.date,0,'📏','Рост и вес',[ms.weight?nf(ms.weight)+' кг':'',ms.height?nf(ms.height)+' см':''].filter(Boolean).join(', '),p.id,'openPerson',p.id));
  });
  return ev.sort((a,b)=>a.date===b.date?b.ts-a.ts:(a.date<b.date?1:-1));
}

  if(!ev.length)return '<div class="card empty" style="margin-top:12px"><div class="e">📖</div>'+(q?'Ничего не найдено':'Здесь будет вся медицинская история: болезни, визиты, лекарства, изменения доз, анализы, прививки.')+'</div>';

const stack=[];let hooks={};

function diffMed(a,b){
  const c=[];
  if(a.name!==b.name)c.push('Название: '+a.name+' → '+b.name);
  if((a.dose||'')!==(b.dose||''))c.push('Доза: '+(a.dose||'—')+' → '+(b.dose||'—'));
  if(a.prn!==b.prn)c.push(b.prn?'Теперь по необходимости':'Теперь по расписанию');
  if(!b.prn&&(a.times||[]).join(',')!==(b.times||[]).join(','))c.push('Время: '+((a.times||[]).join(', ')||'—')+' → '+b.times.join(', '));
  if(a.food!==b.food)c.push('Еда: '+a.food+' → '+b.food);
  if(a.form!==b.form)c.push('Форма: '+a.form+' → '+b.form);
  if(a.start!==b.start)c.push('Начало: '+fmtD(a.start)+' → '+fmtD(b.start));
  const ea=endText(a),eb=endText(Object.assign({},a,b));if(ea!==eb)c.push('Курс: '+ea+' → '+eb);
  if(b.prn&&(a.interval||null)!==(b.interval||null))c.push('Интервал: '+(a.interval?nf(a.interval)+' ч':'—')+' → '+(b.interval?nf(b.interval)+' ч':'—'));
  return c;
}

function tempChart(entries,fixed){
  const pts=entries.filter(e=>e.temp!=null).sort((a,b)=>a.at-b.at);
  if(!pts.length)return '<div class="muted" style="padding:6px 0">Температуру ещё не записывали</div>';
  const C=fixed?{grid:'#e3ddd4',txt:'#777',line:'#cf6646',hi:'#c62828',mid:'#d27a14',ok:'#2e7d4f',bg:'#fff'}:{grid:'var(--line)',txt:'var(--muted)',line:'var(--accent)',hi:'var(--red)',mid:'var(--orange)',ok:'var(--green)',bg:'var(--card)'};
  const W=340,H=180,L=34,R=12,T=14,B=28;
  let t0=pts[0].at,t1=pts[pts.length-1].at;if(t1-t0<3600000){t0-=3600000;t1+=3600000;}
  const temps=pts.map(p=>p.temp),lo=Math.min(35.5,Math.min(...temps)-0.3),hi=Math.max(39.5,Math.max(...temps)+0.3);
  const x=t=>L+(t-t0)/(t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:560px">';
  for(let g=Math.ceil(lo);g<=Math.floor(hi);g++){const yy=y(g).toFixed(1),sp=g===37||g===38;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" style="stroke:'+(g===38?C.hi:g===37?C.mid:C.grid)+';stroke-width:'+(sp?1.2:1)+';'+(sp?'stroke-dasharray:4 4;opacity:.7':'')+'"/><text x="'+(L-6)+'" y="'+(+yy+4)+'" text-anchor="end" style="font-size:11px;fill:'+C.txt+'">'+g+'°</text>';}
  if(pts.length>1)s+='<polyline fill="none" style="stroke:'+C.line+';stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round" points="'+pts.map(p=>x(p.at).toFixed(1)+','+y(p.temp).toFixed(1)).join(' ')+'"/>';
  const mx=Math.max(...temps);let mxShown=false;
  pts.forEach(p=>{const c=p.temp>=38?C.hi:p.temp>=37.1?C.mid:C.ok;s+='<circle cx="'+x(p.at).toFixed(1)+'" cy="'+y(p.temp).toFixed(1)+'" r="4.5" style="fill:'+c+';stroke:'+C.bg+';stroke-width:2"/>';if(p.temp===mx&&!mxShown){mxShown=true;s+='<text x="'+x(p.at).toFixed(1)+'" y="'+(y(p.temp)-9).toFixed(1)+'" text-anchor="middle" style="font-size:12px;font-weight:700;fill:'+c+'">'+nf(p.temp)+'</text>';}});
  const lab=ts=>{const d=new Date(ts);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+hm(ts);};
  s+='<text x="'+L+'" y="'+(H-8)+'" style="font-size:11px;fill:'+C.txt+'">'+lab(pts[0].at)+'</text>';
  if(pts.length>1)s+='<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" style="font-size:11px;fill:'+C.txt+'">'+lab(pts[pts.length-1].at)+'</text>';
  return s+'</svg>';
}

async function shareFile(name,text,mime){
  const blob=new Blob([text],{type:mime});
  try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}}
  catch(e){if(e&&e.name==='AbortError')return false;}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true;
}

  const photos={};

function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function buildIcs(m){
  const p=person(m.person),t=today(),start=m.start>t?m.start:t,e=medEnd(m);
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Zdorovie semyi//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  m.times.forEach((tm,i)=>{L.push('BEGIN:VEVENT','UID:'+m.id+'-'+i+'-'+Date.now()+'@zdorovie','DTSTAMP:'+stamp,'DTSTART:'+start.replace(/-/g,'')+'T'+tm.replace(':','')+'00','DURATION:PT15M','RRULE:FREQ=DAILY'+(e?';UNTIL='+e.replace(/-/g,'')+'T235959':''),'SUMMARY:'+icsEsc('💊 '+(p?p.name+': ':'')+m.name+(m.dose?' — '+m.dose:'')),'DESCRIPTION:'+icsEsc([m.food&&m.food!=='Неважно'?m.food:'',m.note,'Отметьте приём в приложении «Здоровье семьи»'].filter(Boolean).join('. ')),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Пора: '+m.name),'TRIGGER:-PT0M','END:VALARM','END:VEVENT');});
  L.push('END:VCALENDAR');return L.join('\r\n');
}

/* ================= PIN ================= */
async function hashPin(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fh:'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let h=5381;for(const c of 'fh:'+p)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h;}}
let lk={mode:null,buf:'',first:''};
function showLock(mode){lk={mode,buf:'',first:''};$('#lkTitle').textContent=mode==='unlock'?'Введите PIN-код':'Придумайте PIN-код из 4 цифр';$('#lkErr').textContent='';$('#lkAlt').textContent=mode==='unlock'?'Забыли PIN?':'Отмена';drawDots();$('#lock').classList.add('show');}
function drawDots(){$$('#lkDots i').forEach((d,i)=>d.classList.toggle('on',i<lk.buf.length));}
function lkErr(msg){lk.buf='';drawDots();$('#lkErr').textContent=msg;const d=$('#lkDots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');}
async function lkPress(k){
  if(k==='del'){lk.buf=lk.buf.slice(0,-1);drawDots();return;}
  if(lk.buf.length>=4)return;lk.buf+=k;drawDots();$('#lkErr').textContent='';if(lk.buf.length<4)return;
  const code=lk.buf;await new Promise(r=>setTimeout(r,120));
  if(lk.mode==='unlock'){if(await hashPin(code)===state.settings.pin){$('#lock').classList.remove('show');renderMain();}else lkErr('Неверный PIN-код');}
  else if(lk.mode==='set1'){lk.first=code;lk.mode='set2';lk.buf='';$('#lkTitle').textContent='Повторите PIN-код';drawDots();}
  else if(lk.mode==='set2'){if(code===lk.first){state.settings.pin=await hashPin(code);save();$('#lock').classList.remove('show');renderMain();toast('PIN-код включён 🔒');}else{lk.mode='set1';$('#lkTitle').textContent='Придумайте PIN-код из 4 цифр';lkErr('Не совпало, попробуйте ещё раз');}}
}
$('#lkPad').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b)lkPress(b.dataset.k);});
$('#lkAlt').addEventListener('click',async()=>{
  if(lk.mode!=='unlock'){$('#lock').classList.remove('show');return;}
  if(confirm('PIN-код нельзя восстановить.\nМожно сбросить его, но тогда удалятся ВСЕ данные на этом телефоне (потом их можно вернуть из резервной копии).\n\nСбросить?')&&confirm('Точно удалить все данные и сбросить PIN?')){await wipeAll();$('#lock').classList.remove('show');}
});

function take(mid,date,slot){
  const m=med(mid);if(!m)return;if(slot!=null&&intakeFor(mid,date,slot))return;
  const at=date===today()?Date.now():parseD(date).getTime()+(slot?toMin(slot):12*60)*60000;
  const it={id:uid(),med:mid,person:m.person,date,slot:slot==null?null:slot,status:'taken',at};
  state.intakes.push(it);let used=0;
  if(m.stock!=null){used=+m.perDose||1;m.stock=Math.max(0,Math.round((+m.stock-used)*100)/100);}
  delete state.snooze[mid+'|'+date+'|'+slot];save();rerender();
  if(navigator.vibrate)navigator.vibrate(15);
  toast('✓ '+m.name,()=>{state.intakes=state.intakes.filter(x=>x.id!==it.id);if(used)m.stock=Math.round((+m.stock+used)*100)/100;save();rerender();});
}
let toastT;
function toast(msg,undo){const t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button id="undoBtn">Отменить</button>':'');t.classList.add('show');clearTimeout(toastT);if(undo)$('#undoBtn').onclick=()=>{clearTimeout(toastT);undo();toast('Отменено');};toastT=setTimeout(()=>t.classList.remove('show'),undo?5000:2200);}
function pickPhotos(cb){const inp=$('#photoInput');inp.value='';inp.onchange=async()=>{const files=Array.from(inp.files||[]);if(!files.length)return;toast('Сохраняю фото…');const ids=[];for(const f of files){try{ids.push(await putPhoto(await compressImage(f)));}catch(e){alert('Не удалось добавить фото: '+f.name);}}cb(ids);};inp.click();}
const entityFor=(kind,id)=>kind==='ill'?ill(id):kind==='visit'?state.visits.find(v=>v.id===id):state.tests.find(t=>t.id===id);
let viewerCtx=null;

const A={
  setPerson:d=>{ui.person=d.id;renderMain();},
  medSeg:d=>{ui.medSeg=d.v;renderMain();},
  illSeg:d=>{ui.illSeg=d.v;renderMain();},
  histSeg:d=>{ui.histSeg=d.v;renderMain();},
  closeSheet:()=>closeAll(),
  backSheet:()=>popSheet(),
  welcomeOk:()=>{state.settings.welcomed=true;save();renderMain();},
  goFamily:()=>{state.settings.welcomed=true;save();switchTab('more');},
  take:d=>take(d.med,d.date,d.slot),
  give:d=>{const m=med(d.id);if(!m)return;const last=lastPrn(m);
    if(m.interval&&last&&Date.now()<last.at+m.interval*3600000&&!confirm('С прошлого приёма прошло '+ago(last.at).replace(' назад','')+'.\nВ назначении: не чаще раза в '+nf(m.interval)+' ч.\n\nВсё равно отметить?'))return;
    const c=prnCountDay(m,today());if(m.maxPerDay&&c>=m.maxPerDay&&!confirm('Сегодня уже '+c+' раз (максимум '+m.maxPerDay+').\nВсё равно отметить?'))return;
    take(m.id,today(),null);},
  skip:d=>pushSheet(skipForm(d.med,d.date,d.slot)),
  snooze:d=>{state.snooze[d.med+'|'+d.date+'|'+d.slot]=Date.now()+30*60000;save();rerender();toast('Отложено на 30 минут');},
  editIntake:d=>pushSheet(intakeEdit(d.id)),
  delIntake:d=>{const it=state.intakes.find(i=>i.id===d.id);if(!it||!confirm('Удалить эту отметку?'))return;const m=med(it.med);if(m&&m.stock!=null&&it.status==='taken')m.stock=Math.round((+m.stock+(+m.perDose||1))*100)/100;state.intakes=state.intakes.filter(i=>i.id!==d.id);save();popSheet();toast('Отметка удалена');},
  openMed:d=>pushSheet(medDetail(d.id)),
  addMed:()=>pushSheet(medForm(null)),
  editMed:d=>pushSheet(medForm(d.id)),
  pauseMed:d=>{const m=med(d.id);const r=prompt('Почему приостанавливаете? (необязательно)','');if(r===null)return;m.status='paused';m.pauses.push({from:today(),to:null});m.history.push({ts:Date.now(),type:'pause',text:'Приём приостановлен',reason:r.trim()});save();rerender();toast('Поставлено на паузу');},
  resumeMed:d=>{const m=med(d.id);m.status='active';const lp=m.pauses[m.pauses.length-1];if(lp&&!lp.to)lp.to=today();m.history.push({ts:Date.now(),type:'resume',text:'Приём возобновлён'});save();rerender();toast('Приём возобновлён');},
  doneMed:d=>{const m=med(d.id);const r=prompt('Завершить курс сегодня. Причина? (необязательно)\nНапример: врач отменил, выздоровел','');if(r===null)return;m.status='done';m.doneDate=today();const lp=m.pauses[m.pauses.length-1];if(lp&&!lp.to)lp.to=today();m.history.push({ts:Date.now(),type:'done',text:'Курс завершён',reason:r.trim()});save();rerender();toast('Курс завершён');},
  reopenMed:d=>{const m=med(d.id);if(!confirm('Возобновить курс «'+m.name+'»? Затем можно будет изменить даты.'))return;m.status='active';m.doneDate=null;const e=medEnd(m);if(e&&e<today()){m.endType='forever';}m.history.push({ts:Date.now(),type:'reopen',text:'Курс возобновлён'+(e&&e<today()?' (без даты окончания)':'')});save();rerender();},
  delMed:d=>{const m=med(d.id);if(!confirm('Удалить «'+m.name+'» и всю историю его приёма?\n\nЕсли курс просто закончился — лучше нажмите «Завершить курс», тогда история сохранится.'))return;state.meds=state.meds.filter(x=>x.id!==m.id);state.intakes=state.intakes.filter(i=>i.med!==m.id);save();popSheet();toast('Удалено');},
  restock:d=>pushSheet(restockForm(d.id)),
  ics:d=>{const m=med(d.id);const e=medEnd(m);if(e&&e<today()){alert('Курс уже закончился');return;}pushSheet(icsSheet(d.id));},
  icsOpen:d=>{const ics=buildIcs(med(d.id));const a=document.createElement('a');a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();},
  icsShare:d=>{const m=med(d.id);shareFile('napominanie-'+m.name.replace(/[^\wа-яё]+/gi,'-')+'.ics',buildIcs(m),'text/calendar');},
  presetTime:(d,el)=>{const box=$('#timesBox');const ex=$$('input',box).map(i=>i.value);if(ex.includes(d.t))return;const empty=$$('input',box).find(i=>!i.value);if(empty){empty.value=d.t;return;}box.insertAdjacentHTML('beforeend',timeRow(d.t));},
  addTime:()=>{$('#timesBox').insertAdjacentHTML('beforeend',timeRow('12:00'));const ins=$$('#timesBox input');ins[ins.length-1].focus();},
  rmTime:(d,el)=>{el.closest('.trow').remove();},
  setTemp:d=>{$('#f_temp').value=d.v;},
  pickColor:(d,el)=>{$$('#colors button').forEach(b=>b.classList.toggle('on',b===el));},
  openIll:d=>pushSheet(illDetail(d.id)),
  addIll:()=>pushSheet(illForm(null)),
  editIll:d=>pushSheet(illForm(d.id)),
  delIll:d=>{const i=ill(d.id);if(!confirm('Удалить «'+i.title+'» со всеми записями и фото?'))return;i.photos.forEach(delPhoto);state.meds.forEach(m=>{if(m.illness===i.id)m.illness='';});state.visits.forEach(v=>{if(v.illness===i.id)v.illness='';});state.illnesses=state.illnesses.filter(x=>x.id!==i.id);save();popSheet();toast('Удалено');},
  recover:d=>{const i=ill(d.id);const v=prompt('Дата выздоровления (ДД.ММ.ГГГГ):',fmtD(today()));if(v===null)return;const m=v.trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);const dt=m?m[3]+'-'+pad(m[2])+'-'+pad(m[1]):today();i.end=dt<i.start?i.start:dt;save();rerender();toast('Ура, выздоровели! 💚');
    const act=state.meds.filter(x=>x.illness===i.id&&['active','paused'].includes(medState(x))&&!x.prn);if(act.length)setTimeout(()=>alert('Ещё активны лекарства этой болезни: '+act.map(x=>x.name).join(', ')+'.\nЕсли врач их отменил — завершите курс в карточке лекарства.'),300);},
  unrecover:d=>{ill(d.id).end=null;save();rerender();},
  addEntry:d=>pushSheet(entryForm(d.id,null)),
  editEntry:d=>pushSheet(entryForm(d.ill,d.id)),
  delEntry:d=>{const i=ill(d.ill);if(!confirm('Удалить запись?'))return;i.entries=i.entries.filter(e=>e.id!==d.id);save();popSheet();},
  quickTemp:()=>{const act=state.illnesses.filter(i=>!i.end&&vis(i.person));if(act.length===1){pushSheet(entryForm(act[0].id,null));return;}if(act.length>1){pushSheet(()=>({title:'Кому записать?',body:'<div class="list">'+act.map(i=>'<button class="row" data-act="addEntry" data-id="'+i.id+'">'+av(person(i.person))+'<div class="grow"><div class="t">'+esc(pname(i.person))+'</div><div class="s">'+esc(i.title)+'</div></div><span class="chev">›</span></button>').join('')+'</div><div class="btns"><button class="btn" data-act="addIll">+ Заболел кто-то ещё</button></div>'}));return;}
    pushSheet(illForm(null,{title:'Температура',symptoms:['Температура']}));toast('Сначала заведите болезнь — потом записи температуры');},
  addMedForIll:d=>{const i=ill(d.id);pushSheet(medForm(null,{person:i.person,illness:i.id,reason:i.title,doctor:i.doctor||''}));},
  addPhoto:d=>pickPhotos(ids=>{const e=entityFor(d.kind,d.id);if(!e)return;e.photos.push(...ids);save();refreshSheet();toast(ids.length>1?'Фото добавлены':'Фото добавлено');}),
  viewPhoto:async d=>{viewerCtx=d;$('#vImg').src=(await getPhoto(d.photo))||'';$('#viewer').classList.add('show');},
  closeViewer:()=>{$('#viewer').classList.remove('show');$('#vImg').removeAttribute('src');},
  openVisit:d=>pushSheet(visitDetail(d.id)),
  addVisit:()=>pushSheet(visitForm(null)),
  editVisit:d=>pushSheet(visitForm(d.id)),
  delVisit:d=>{const v=state.visits.find(x=>x.id===d.id);if(!confirm('Удалить визит?'))return;v.photos.forEach(delPhoto);state.visits=state.visits.filter(x=>x.id!==d.id);save();popSheet();},
  medFromVisit:d=>{const v=state.visits.find(x=>x.id===d.id);const il=v.illness?ill(v.illness):null;pushSheet(medForm(null,{person:v.person,doctor:[v.specialty,v.doctor].filter(Boolean).join(' '),reason:il?il.title:'',illness:v.illness||'',note:v.prescriptions||'',start:v.date>today()?v.date:today()}));},
  openTest:d=>pushSheet(testDetail(d.id)),
  addTest:()=>pushSheet(testForm(null)),
  editTest:d=>pushSheet(testForm(d.id)),
  delTest:d=>{const x=state.tests.find(t=>t.id===d.id);if(!confirm('Удалить анализ?'))return;x.photos.forEach(delPhoto);state.tests=state.tests.filter(t=>t.id!==d.id);save();popSheet();},
  calShift:d=>{const [y,m]=ui.calMonth.split('-').map(Number);const dt=new Date(y,m-1+(+d.v),1);ui.calMonth=dt.getFullYear()+'-'+pad(dt.getMonth()+1);renderMain();},
  calDay:d=>{ui.calDay=d.v;renderMain();},
  openPerson:d=>pushSheet(personDetail(d.id)),
  addPerson:()=>pushSheet(personForm(null)),
  editPerson:d=>pushSheet(personForm(d.id)),
  delPerson:d=>{const p=person(d.id);if(state.people.length<=1){alert('Должен остаться хотя бы один профиль');return;}if(!confirm('Удалить профиль «'+p.name+'» и ВСЕ его записи: лекарства, болезни, визиты, анализы?'))return;if(!confirm('Точно удалить? Это нельзя отменить.'))return;
    state.illnesses.filter(i=>i.person===p.id).forEach(i=>i.photos.forEach(delPhoto));state.visits.filter(i=>i.person===p.id).forEach(i=>i.photos.forEach(delPhoto));state.tests.filter(i=>i.person===p.id).forEach(i=>i.photos.forEach(delPhoto));
    const mids=state.meds.filter(m=>m.person===p.id).map(m=>m.id);state.meds=state.meds.filter(m=>m.person!==p.id);state.intakes=state.intakes.filter(i=>!mids.includes(i.med));['illnesses','visits','tests'].forEach(k=>{state[k]=state[k].filter(x=>x.person!==p.id);});state.people=state.people.filter(x=>x.id!==p.id);if(ui.person===p.id)ui.person='all';save();popSheet();toast('Профиль удалён');},
  addMeasure:d=>pushSheet(measureForm(d.id)),
  delMeasure:d=>{const p=person(d.p);if(!confirm('Удалить запись?'))return;p.measures=p.measures.filter(m=>m.id!==d.id);save();refreshSheet();},
  addVaccine:d=>pushSheet(vaccineForm(d.id)),
  delVaccine:d=>{const p=person(d.p);if(!confirm('Удалить прививку?'))return;p.vaccines=p.vaccines.filter(m=>m.id!==d.id);save();refreshSheet();},
  report:()=>pushSheet(reportSetup()),
  reportFor:d=>pushSheet(reportSetup(d.id)),
  closeReport:()=>{$('#report').classList.remove('show');},
  printReport:()=>window.print(),
  backup:()=>exportBackup(),
  backupLater:()=>{state.settings.backupNag=Date.now();save();renderMain();},
  restore:()=>{const inp=$('#restoreInput');inp.value='';inp.onchange=()=>{if(inp.files&&inp.files[0])importBackup(inp.files[0]);};inp.click();},
  transfer:()=>pushSheet(()=>({title:'Перенос на другой телефон',body:'<div class="card" style="line-height:1.5"><b>Как сделать копию истории на телефоне мужа:</b><br><br>1. Здесь нажмите «Сохранить резервную копию» → отправьте файл через WhatsApp, Telegram или AirDrop.<br>2. На втором iPhone установите это же приложение (тот же адрес сайта → «На экран „Домой“»).<br>3. Там: «Ещё» → «Восстановить из копии» → выберите полученный файл.<br><br>⚠ Это копия на момент отправки. Телефоны не синхронизируются сами: главный телефон — у жены, на втором удобно смотреть историю. Чтобы обновить, повторите перенос.</div><div class="btns"><button class="btn primary" data-act="backup">💾 Сохранить копию сейчас</button></div>'})),
  pin:()=>{if(state.settings.pin){if(confirm('Выключить PIN-код?')){state.settings.pin=null;save();renderMain();toast('PIN-код выключен');}}else showLock('set1');},
  wipe:async()=>{if(!confirm('Удалить ВСЕ данные: профили, лекарства, болезни, фото?\n\nСначала советуем сохранить резервную копию.'))return;if(!confirm('Точно удалить всё? Это нельзя отменить.'))return;await wipeAll();},
};
$('#vDel').addEventListener('click',async()=>{if(!viewerCtx||!confirm('Удалить это фото?'))return;const e=entityFor(viewerCtx.kind,viewerCtx.id);if(e){e.photos=e.photos.filter(p=>p!==viewerCtx.photo);save();}await delPhoto(viewerCtx.photo);A.closeViewer();refreshSheet();toast('Фото удалено');});

document.addEventListener('click',e=>{
  const chip=e.target.closest('.chips .chip');
  if(chip){const box=chip.parentElement;if(box.dataset.multi)chip.classList.toggle('on');else{$$('.chip',box).forEach(c=>c.classList.toggle('on',c===chip));}const h=hooks[box.dataset.name];if(h)h(chip.dataset.v);return;}
  const tab=e.target.closest('.tab');if(tab){switchTab(tab.dataset.tab);return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el);}
});
document.addEventListener('change',e=>{if(e.target.id==='histMed'){ui.histMed=e.target.value;renderMain();}});
document.addEventListener('input',e=>{if(e.target.id==='tlSearch'){ui.search=e.target.value;$('#tlList').innerHTML=timelineHTML();}});

/* ================= start ================= */
(async function start(){
  await initStorage();
  if(state.settings.pin)showLock('unlock');
  renderMain();
  setInterval(()=>{if(!document.hidden&&ui.tab==='today'&&!$('#sheet').classList.contains('open'))renderMain();},60000);
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
</script>
</body>
</html>
